<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AssetFactory</title>
  <link rel="stylesheet" href="./viewer.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <header>
    <div class="identity"><h1>AssetFactory</h1><p id="description">A workspace for procedural 3D assets.</p></div>
    <button id="reload" type="button">Reload assets</button>
  </header>
  <main>
    <section class="toolbar" aria-label="Asset controls">
      <div class="field"><label for="asset">Asset</label><select id="asset" disabled></select></div>
      <div class="field"><label for="view">View</label><select id="view" disabled></select></div>
      <div class="field"><label for="background">Backdrop</label><select id="background"><option value="studio">Studio</option><option value="dark">Dark</option><option value="transparent">Transparent</option></select></div>
      <div class="actions">
        <button id="angle" type="button" disabled>Angled view</button>
        <button id="reset" type="button" disabled>Reset camera</button>
        <button id="export" class="primary" type="button" disabled>Export all GLBs + PNGs</button>
      </div>
    </section>
    <div id="stage" aria-label="3D asset preview"></div>
    <div class="details"><span id="stats"></span><span>Drag to orbit · Scroll / pinch to zoom · Right-drag to pan</span></div>
  </main>
  <footer><p id="status" role="status">Loading the asset catalog…</p><p id="output"></p></footer>
  <script type="module" src="./viewer.mjs"></script>
</body>
</html>
